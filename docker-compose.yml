services:

  auth-postgres:
    image: postgres:15
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - auth-db:/var/lib/postgresql/data
    networks:
      - saas-net

  user-postgres:
    image: postgres:15
    container_name: user-postgres
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5434:5432"
    volumes:
      - user-db:/var/lib/postgresql/data
    networks:
      - saas-net

  auth-service:
    build:
      context: ./Auth/Auth/target
    image: auth-service:latest
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/auth_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - auth-postgres
    networks:
      - saas-net

  user-service:
    build:
      context: ./User/user/target
    image: user-service:latest
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/user_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      - user-postgres
    networks:
      - saas-net

  gateway-service:
    build:
      context: ./gateway-service/gateway-service/target
    image: gateway-service:latest
    container_name: gateway-service
    environment:
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
    networks:
      - saas-net

networks:
  saas-net:
    driver: bridge

volumes:
  auth-db:
  user-db:

