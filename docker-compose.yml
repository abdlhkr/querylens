services:

  device-postgres:
    image: postgres:15
    container_name: device-postgres
    environment:
      POSTGRES_DB: device_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5435:5432"
    volumes:
      - device-db:/var/lib/postgresql/data
    networks:
      - saas-net

  auth-postgres:
    image: postgres:15
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5433:5432"
    volumes:
      - auth-db:/var/lib/postgresql/data
    networks:
      - saas-net

  user-postgres:
    image: postgres:15
    container_name: user-postgres
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5434:5432"
    volumes:
      - user-db:/var/lib/postgresql/data
    networks:
      - saas-net

  db-service:
    build:
      context: ./database-initialization/database-initialization
    image: db-service:latest
    container_name: db-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://device-postgres:5432/device_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      FAST_SERVICE_URL: http://fast-service:8000
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      - device-postgres
      - fast-service
    networks:
      - saas-net

  auth-service:
    build:
      context: ./Auth/Auth
    image: auth-service:latest
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/auth_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - auth-postgres
    networks:
      - saas-net

  user-service:
    build:
      context: ./User/user
    image: user-service:latest
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/user_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      - user-postgres
    networks:
      - saas-net

  gateway-service:
    build:
      context: ./gateway-service/gateway-service
    image: gateway-service:latest
    container_name: gateway-service
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - db-service
      - redis
    networks:
      - saas-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - saas-net

  fast-service:
    build:
      context: ./Fast-Service
    image: fast-service:latest
    container_name: fast-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    networks:
      - saas-net

  front-app:
    build:
      context: ./front-app
      args:
        VITE_API_URL: https://querylensio.com
    image: front-app:latest
    container_name: front-app
    ports:
      - "80:80"
    depends_on:
      - gateway-service
    networks:
      - saas-net

networks:
  saas-net:
    driver: bridge

volumes:
  auth-db:
  user-db:
  device-db:
