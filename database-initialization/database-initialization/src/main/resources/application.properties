spring.application.name=database-initialization

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:device_db}
spring.datasource.username=${DB_USER:postgres}
# Zayif varsayilan yok: parola env'den gelmek zorunda (docker-compose SPRING_DATASOURCE_PASSWORD ile ezer)
spring.datasource.password=${DB_PASS:}

server.port=${SERVICE_PORT:8083}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Hata detaylari varsayilan olarak kapali; API hatalari zaten GlobalExceptionHandler'dan doner
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING_ERRORS:never}
server.error.include-stacktrace=never
server.error.include-exception=false

logging.level.root=INFO
logging.level.saas.database_initialization=${APP_LOG_LEVEL:INFO}
# SQL ve bind parametresi loglari kullanici verisi sizdirir -> varsayilan kapali
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_BIND_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

spring.web.resources.add-mappings=false

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Fast-Service URL for natural language SQL generation
fast.service.url=${FAST_SERVICE_URL:http://fast-service:8000}
